# Tests, then publishes the static page to GitHub Pages on every push to main.
# Only the files the page loads are uploaded: the pipeline, audit data and
# notes stay in the repo but off the site. A new file the page fetches must be
# added to "Assemble site".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The tests use Node built-ins only, so no npm install.
      - name: Test
        run: npm test
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html styles.css src assets _site/
          cp data/map.json data/directory.web.json _site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
